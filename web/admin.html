<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Борода CRM PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#141414;--ink:#f0f0f0;--muted:#888888;--line:#2a2a2a;
  --red:#8b0000;--blue:#7FA6DB;--ok:#2E7D5B;--warn:#E0A94A;--chip:#1f1f1f;
  --brass:#D4AF37;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif;font-size:14px;line-height:1.45}
h1, h2 {font-family:'Playfair Display',serif; font-weight:600; color:var(--brass); margin:0 0 4px;}
.wrap{max-width:800px;margin:0 auto;padding:0 16px 48px}
header{padding:24px 0; border-bottom:1px solid var(--line); margin-bottom: 20px;}
.tabs{display:flex;gap:6px;margin:14px 0;background:var(--chip);padding:4px;border-radius:12px; border: 1px solid var(--line);}
.tab{flex:1;background:transparent;color:var(--muted);border:0;font:inherit;font-weight:500;padding:10px;border-radius:9px;cursor:pointer; transition:0.3s;}
.tab[aria-selected="true"]{background:var(--brass);color:#000;}
.date-filters {display:flex; gap:12px; margin-bottom: 16px; align-items:center; flex-wrap:wrap;}
input[type=date], input[type=password]{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#050505;color:var(--ink);}
.btn{background:linear-gradient(45deg, #b8860b, #ffd700);color:#000;border:0;padding:12px 20px;border-radius:8px;font-weight:600;cursor:pointer; text-transform:uppercase;}
.stats{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px; text-align:center;}
.stat b{display:block;font-size:24px; color:var(--brass);}
.stat span{font-size:11px;color:var(--muted); text-transform:uppercase;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;}
.row{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.time{font-size:15px; color:var(--brass); font-weight:600; min-width:60px;}
.grow{flex:1}
.badge{font-size:10px;padding:3px 8px;border-radius:12px;text-transform:uppercase; margin-left:8px;}
.booked{background:var(--warn);color:#fff}
.done{background:var(--ok);color:#fff}
.cancelled{background:var(--red);color:#fff}
.acts{margin-top:10px;}
.mini{background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px; transition:0.2s;}
.mini:hover{border-color:var(--brass)}
.mini.go{background:var(--brass);color:#000;border-color:var(--brass)}
.empty{color:var(--muted);padding:8px 0; font-style:italic;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:grid;place-items:center;z-index:20;}
.dlg{background:var(--surface);padding:24px;border-radius:12px;border:1px solid var(--brass); width:320px; text-align:center;}
.err{color:var(--red);font-size:13px;min-height:18px;margin:8px 0 0}
.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:20px; border-top:1px solid var(--line); padding-top:10px;}
.link{background:none;border:0;color:var(--brass);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Борода CRM PRO</h1>
  <span style="color:var(--muted)">Аналітика та керування бізнесом</span>
</header>

<div class="tabs" role="tablist">
  <button class="tab" id="t-day" aria-selected="true" data-tab="day">Записи (Період)</button>
  <button class="tab" id="t-cli" aria-selected="false" data-tab="cli">База клієнтів</button>
</div>

<section id="day" role="tabpanel">
  <div class="date-filters">
    <span style="color:var(--muted)">Період з:</span>
    <input type="date" id="dstart">
    <span style="color:var(--muted)">по:</span>
    <input type="date" id="dend">
  </div>
  
  <div class="stats">
    <div class="stat"><b id="s-rev">0 ₴</b><span>Виручка</span></div>
    <div class="stat"><b id="s-done">0</b><span>Завершено</span></div>
    <div class="stat"><b id="s-count">0</b><span>Очікується</span></div>
    <div class="stat"><b id="s-lost" style="color:var(--red)">0 ₴</b><span style="color:var(--red)">Відміни</span></div>
  </div>
  <div class="card" id="daylist"></div>
</section>

<section id="cli" role="tabpanel" hidden>
  <div class="card" id="clilist"></div>
</section>

<div class="foot">
  <button class="link" id="rekey">Вийти / Змінити ключ</button>
</div>
</div>

<div class="overlay" id="lock">
  <div class="dlg">
    <h2>Авторизація</h2>
    <input type="password" id="key" placeholder="Введіть токен" style="margin:16px 0; width:100%;">
    <p class="err" id="keyerr"></p>
    <button class="btn" id="unlock" style="width:100%">Увійти</button>
  </div>
</div>

<script>
/* ТВОЙ РАБОЧИЙ И ПРОВЕРЕННЫЙ СКРИПТ (С АДАПТАЦИЕЙ ПОД 2 ИНПУТА ДАТЫ) */
(function(){
  var STATUS={booked:"Очікується",done:"Завершено",cancelled:"Скасовано"};
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function money(n){return (n||0).toLocaleString("uk-UA")+" ₴"}
  function pad(n){return n<10?"0"+n:""+n}
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function key(){return localStorage.getItem("admin_key")||""}
  function setKey(k){if(k)localStorage.setItem("admin_key",k);else localStorage.removeItem("admin_key")}

  function req(path,opts){
    opts=opts||{};
    opts.headers=Object.assign({"X-Admin-Token":key()},opts.headers||{});
    if(opts.body&&typeof opts.body!=="string"){opts.body=JSON.stringify(opts);opts.headers["Content-Type"]="application/json"}
    return fetch(path,opts).then(function(r){
      return r.json().then(function(j){
        if(r.status===403){setKey("");$("lock").hidden=false;throw new Error("Невірний ключ доступу")}
        return j;
      });
    });
  }

  function renderDay(){
    var start=$("dstart").value||iso(new Date());
    var end=$("dend").value||iso(new Date());
    
    req("/admin/api/day?start="+start+"&end="+end).then(function(r){
      if(!r.ok){$("daylist").innerHTML='<p class="empty">'+(r.error||"Помилка")+"</p>";return}
      
      // Выводим новую аналитику
      $("s-rev").textContent=money(r.stats.revenue);
      $("s-done").textContent=r.stats.done_count || 0;
      $("s-count").textContent=(r.stats.count - (r.stats.done_count || 0)) || 0;
      $("s-lost").textContent=money(r.stats.lost_revenue || 0);
      
      if(!r.items.length){$("daylist").innerHTML="<p class=\"empty\">Записів на цей період немає.</p>";return}
      
      $("daylist").innerHTML=r.items.map(function(a){
        var acts="";
        if(a.status==="booked")acts='<button class="mini go" data-act="done" data-id="'+a.id+'">Завершено</button> <button class="mini" data-act="cancelled" data-id="'+a.id+'">Скасувати</button>';
        else acts='<button class="mini" data-act="booked" data-id="'+a.id+'">Повернути в очікування</button>';
        
        return '<div class="row"><div class="time">'+esc(a.date)+'<br>'+esc(a.time)+'</div><div class="grow"><b>'+esc(a.name)+'</b>'
          +' <span class="badge '+a.status+'">'+STATUS[a.status]+'</span>'
          +'<div style="color:var(--muted); font-size:12px; margin-top:4px;">'+esc(a.service)+" · "+esc(a.master)+" · "+money(a.price)+" · "+esc(a.source)+'</div>'
          +'<div style="font-size:13px; margin-top:2px;">'+esc(a.phone)+'</div><div class="acts">'+acts+"</div></div></div>";
      }).join("");
    }).catch(function(e){$("daylist").innerHTML='<p class="empty">'+esc(e.message)+"</p>"});
  }

  function renderClients(){
    req("/admin/api/clients").then(function(r){
      if(!r.ok){$("clilist").innerHTML='<p class="empty">'+(r.error||"Помилка")+"</p>";return}
      if(!r.clients.length){$("clilist").innerHTML="<p class=\"empty\">Клієнтів поки немає.</p>";return}
      var today=new Date();today.setHours(0,0,0,0);
      $("clilist").innerHTML=r.clients.map(function(c){
        var days=c.last?Math.round((today-new Date(c.last+"T00:00:00"))/86400000):null;
        var stale=days!==null&&days>=30&&!c.upcoming;
        var p=String(c.phone);
        return '<div class="row"><div class="grow"><b>'+esc(c.name)+'</b>'
          +'<div style="color:var(--muted); font-size:12px; margin-top:4px;">'+esc(c.phone)+" · Візитів: "+(c.visits||0)+" · Сума: "+money(c.spent)+(c.last?" · Останній: "+esc(c.last):"")+'</div>'
          +(stale?'<div class="acts"><button class="mini go" data-phone="'+esc(p)+'">Нагадати про візит</button></div>':"")
          +"</div></div>";
      }).join("");
    }).catch(function(e){$("clilist").innerHTML='<p class="empty">'+esc(e.message)+"</p>"});
  }

  document.addEventListener("click",function(e){
    var t=e.target.closest("button");if(!t)return;
    if(t.dataset.tab){
      ["day","cli"].forEach(function(id){
        $(id).hidden=id!==t.dataset.tab;
        $("t-"+id).setAttribute("aria-selected",id===t.dataset.tab);
      });
      if(t.dataset.tab==="day")renderDay();else renderClients();
      return;
    }
    if(t.dataset.act){
      req("/admin/api/status",{method:"POST",body:{id:t.dataset.id,status:t.dataset.act}})
        .then(function(r){if(r.ok){renderDay()}else alert(r.error||"Помилка")});
      return;
    }
    if(t.dataset.phone){
      var text="Привіт! Це барбершоп «Борода». Давно не бачились. Запишіться онлайн на зручний час, і ми вас чекаємо.";
      try{navigator.clipboard.writeText(text).then(function(){alert("Повідомлення скопійовано")},function(){alert(text)})}catch(err){alert(text)}
      return;
    }
    if(t.id==="unlock"){
      var k=$("key").value.trim();
      $("keyerr").textContent="";
      req("/admin/api/clients", {headers: {"X-Admin-Token": k}}).then(function(r){
        if(r.ok){setKey(k);$("lock").hidden=true;renderDay()}
        else{$("keyerr").textContent=r.error||"Немає доступу";setKey("")}
      }).catch(function(){
        setKey("");
        $("keyerr").textContent="Невірний ключ або немає з'єднання.";
      });
      return;
    }
    if(t.id==="rekey"){setKey("");$("lock").hidden=false;$("key").value="";return}
  });

  $("dstart").addEventListener("change",renderDay);
  $("dend").addEventListener("change",renderDay);

  var today=iso(new Date());
  $("dstart").value=today;
  $("dend").value=today;
  if(!key()){$("lock").hidden=false}
  else{renderDay()}
})();
</script>
</body>
</html>
